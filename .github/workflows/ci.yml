name: CI

on:
  pull_request:
  push:
    branches: [ main ]
    paths-ignore:
      - CHANGELOG.md
      - version.txt
      - .release-please-manifest.json

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'release-please--branches--main' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run routes:generate
      - run: bun run lint
      - run: bun run typecheck

  tests:
    name: Tests
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'release-please--branches--main' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4.6
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LOG_LEVEL: silent
      REDIS_ENABLED: "false"
      ADMIN_PASSWORD: TestAdminPassword!
      DATABASE_URL: /tmp/mylists-unit-tests.db
      MYLISTS_TEST_REDIS_URL: redis://127.0.0.1:6379
      ADMIN_TOKEN_SECRET: unit-test-admin-token-secret
      BETTER_AUTH_SECRET: unit-test-auth-secret-for-ci
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run routes:generate
      - run: bun run test

  browser:
    name: Browser tests
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'release-please--branches--main' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 1
